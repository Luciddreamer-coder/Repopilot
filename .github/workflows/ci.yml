name: RepoPilot CI

on:
  push:
  pull_request:

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked application dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Run offline test suite
        run: make test
      - name: Run CLI quality gate against demo
        run: python repopilot_cli.py check demo --max-risk 90 --max-new-findings 0
